  authors: Kokate, K., Aristimunha, B., Truong, D., & Delorme, A.
  year: 2026
  title: 'Channel Adaptation for EEG Foundation Models: A Systematic Benchmark Across Architectures, Tasks, and Training Regimes'
  venue: Preprint (arXiv)
  type: conference
  status: under-review
  links:
    pdf: /assets/pdfs/channel-adaptation-eeg-fm.pdf
    arxiv: https://arxiv.org/abs/2604.23091
  figure: /assets/images/publications/channel-adaptation-eeg-fm.png
  map:
    area: Models
    topic: Foundation and transfer models
    label: Channel Adaptation for EEG Foundation Models
  abstract: >-
    Scaling EEG foundation models requires pooling data across heterogeneous electrode montages, a prerequisite both for larger pretraining corpora and for downstream deployment. We present the first systematic comparison of four channel adaptation methods (Conv1d projection, spherical spline interpolation (SSI), source-space decomposition, and Riemannian re-centering) across five pretrained EEG foundation models (5M-157M parameters), five downstream tasks, and two training regimes with 10-15 random seeds each. We find that rigid-montage models (BENDR, Neuro-GPT) require external adaptation, while flexible models (EEGPT, CBraMod) match or exceed it natively when fine-tuned but benefit from external methods under frozen-encoder deployment. A probe-SFT asymmetry exists: external adaptation can cause severe negative transfer during fine-tuning of flexible models. The optimal method is architecture-dependent (Conv1d for BENDR, SSI/Riemannian for Neuro-GPT, source-space decomposition for depression detection), and 5M-parameter CBraMod outperforms models up to 31x larger on 4/5 datasets, consistent with independent findings that compact EEG-specific architectures can match larger models.
