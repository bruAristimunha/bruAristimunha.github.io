  authors: Hajhassani, D., Graignic, P-A., Aristimunha, B., Mellot, A., Mariani, T., Nober, C., Lopes, B. J., Burgund, L., Kusch, L., Semah, T., & Caillet, A. H.
  year: 2026
  title: 'Automated Artifact Removal in EEG Age Prediction: A Systematic Comparison'
  venue: IEEE International Conference on Acoustics, Speech and Signal Processing (ICASSP 2027)
  venue_short: ICASSP
  type: conference
  status: submitted
  figure: /assets/images/publications/artifact-removal-age-icassp27.png
  map:
    area: Preprocessing
    label: Artifact Removal for EEG Age Prediction
  abstract: >-
    Automated EEG artifact removal may improve downstream analysis but can also alter predictive information. We benchmarked nine automated artifact removal methods against a common no-artifact-removal baseline for cross-dataset EEG age prediction. We introduce Signal Quality Index (SQI)-guided GEDAI, which leverages local signal-quality assessment to restrict correction to the channel-epoch pairs requiring intervention. Three deep neural architectures were trained on TUEG and evaluated without target-domain fitting on ds005385, LEMON, and TDBRAIN. Across this setting, GEDAI and SQI-guided GEDAI were the only methods with consistent gains over baseline in age prediction performance across all datasets and architectures ( =-0.77/-0.64 years, R²=+0.083/+0.072, respectively). The remaining methods were neutral or detrimental on average ( =+0.220.16 years, R²=-0.0230.016 across methods). The two GEDAI-based methods achieved closely matched performance, while SQI guidance reduced the median modification ratio from 74.78% to 42.80%. These findings show that curation benefits are method-dependent and establish SQI guidance as a more selective operating point, leaving more of the original EEG unchanged and limiting the potential loss of neural activity while retaining most of GEDAI's predictive benefit.
