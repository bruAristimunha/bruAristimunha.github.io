<div class="masthead">
  <div class="masthead__inner-wrap">
    <a class="site-name" href="{{ '/' | relative_url }}">Bruno Aristimunha<span class="site-name__dot" aria-hidden="true">.</span></a>
      <nav class="site-navigation" aria-label="Main navigation">
        <ul>
          {% for link in site.data.navigation.main %}
            <li><a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
          {% endfor %}
        </ul>
      </nav>
  </div>
</div>
