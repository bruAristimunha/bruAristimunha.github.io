name: Get Citation Data

on:
  schedule:
    - cron: '0 6 * * 1,4'   # Mon + Thu, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: citations
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Google Scholar stats
        run: python3 google_scholar_crawler/main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}

      - name: Commit if changed
        run: |
          if git diff --quiet -- _data/citations.json; then
            echo "Citations unchanged."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/citations.json
          git commit -m "chore: update citation stats"
          git push
          # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy explicitly.
          gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
